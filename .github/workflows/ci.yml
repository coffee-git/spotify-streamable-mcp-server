name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chatgpt-web-spotify-2026-minimal

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
      - run: bun run format:check
      - run: bunx wrangler deploy --dry-run --outdir dist-worker
